[package]
name = "niki_journal"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
tauri = { version = "=2.12.3" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
chrono = { version = "=0.4.45", features = ["serde"] }
uuid = { version = "=1.28.0", features = ["v4", "serde"] }
base64 = "=0.22.1"
flate2 = "=1.1.10"
crc32fast = "=1.5.2"
argon2 = "=0.5.3"
ring = "=0.17.14"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
url = "=2.5.8"
keyring = { version = "=3.6.3", features = ["windows-native"] }

[build-dependencies]
tauri-build = { version = "=2.7.2" }
