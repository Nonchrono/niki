name: Build and Release Niki

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '배포할 버전 태그 (예: v0.1.0, v0.1.1)'
        required: false
        default: ''
      publish:
        description: '검증 후 GitHub Release에 게시 (태그 입력 필수)'
        type: boolean
        required: false
        default: false
      notes:
        description: '업데이트 안내 문구 (릴리스 노트)'
        required: false
        default: 'Niki 업데이트 배포'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

jobs:
  test:
    name: Test UI, installer, storage and sync
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Verify React UI build and behavior
        shell: pwsh
        run: |
          $nodeVersion = node -p "process.versions.node"
          if (-not $nodeVersion.StartsWith("26.")) { throw "Node.js 26 is required; found $nodeVersion" }
          Write-Host "Using Node.js $nodeVersion"
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- ui/app.js ui/style.css ui/THIRD_PARTY_LICENSES.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Windows installer wizard
        shell: pwsh
        run: |
          powershell.exe -NoProfile -Sta -ExecutionPolicy Bypass -File tests/windows-installer-ui.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/windows-icons.test.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-tests
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Test storage, migration and sync
        shell: pwsh
        run: |
          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -- --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
      version: ${{ steps.prep.outputs.version }}
      notes: ${{ steps.prep.outputs.notes }}
      win_sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      # Restore before changing the app version, so main and tags use the same key.
      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare version and OAuth config
        id: prep
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH: ${{ inputs.publish }}
          CLIENT_ID: ${{ secrets.NIKI_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NIKI_GOOGLE_CLIENT_SECRET }}
        run: |
          if ($env:PUBLISH -eq 'true' -and [string]::IsNullOrWhiteSpace($env:INPUT_TAG)) { throw 'A tag is required to publish a release.' }
          $currentVersion = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version\s*=\s*"([^"]+)"').Groups[1].Value
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG.Trim() } elseif ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.Trim() } else { "v$currentVersion" }
          if (-not $tag.StartsWith("v")) { $tag = "v$tag" }
          $version = $tag.TrimStart("v", "V")
          $notes = if ($env:INPUT_NOTES) { $env:INPUT_NOTES } else { "Niki v$version 업데이트" }

          (Get-Content Cargo.toml -Raw) -replace '(?m)^version\s*=\s*"[^"]+"', "version = `"$version`"" | Set-Content Cargo.toml -Encoding UTF8
          (Get-Content tauri.conf.json -Raw) -replace '"version":\s*"[^"]+"', "`"version`": `"$version`"" | Set-Content tauri.conf.json -Encoding UTF8

          # Refresh only workspace versions; retain the locked dependency versions.
          cargo update --workspace
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:CLIENT_ID) {
            $json = @{
              installed = @{
                client_id = $env:CLIENT_ID.Trim()
                client_secret = if ($env:CLIENT_SECRET) { $env:CLIENT_SECRET.Trim() } else { "" }
              }
            } | ConvertTo-Json -Depth 4
            Set-Content -Path "oauth-client.json" -Value $json -Encoding UTF8
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "notes=$notes" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build release installer (Niki_Setup.exe)
        id: build
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -Force "target/release/niki_journal.exe" "target/release/Niki_Setup.exe"
          $sha256 = (Get-FileHash -Path "target/release/Niki_Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "sha256=$sha256" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: target/release/Niki_Setup.exe

  build-macos:
    name: Build macOS Universal (Apple Silicon + Intel)
    runs-on: macos-latest
    outputs:
      mac_sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust stable toolchain (Universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-universal-release
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Prepare version and OAuth config
        shell: bash
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PUBLISH: ${{ inputs.publish }}
          CLIENT_ID: ${{ secrets.NIKI_GOOGLE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.NIKI_GOOGLE_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH:-}" == "true" && -z "${INPUT_TAG//[[:space:]]/}" ]]; then
            echo "A tag is required to publish a release." >&2
            exit 1
          fi
          CURRENT_VERSION="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' Cargo.toml | head -n1)"
          TAG="${INPUT_TAG:-}"
          if [[ -z "$TAG" ]]; then
            if [[ "$REF_TYPE" == "tag" ]]; then TAG="$REF_NAME"; else TAG="v$CURRENT_VERSION"; fi
          fi
          TAG="$(echo "$TAG" | xargs)"
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          VERSION="${TAG#v}"
          VERSION="${VERSION#V}"

          sed -i '' -E "s/^version[[:space:]]*=[[:space:]]*\"[^\"]+\"/version = \"${VERSION}\"/" Cargo.toml
          sed -i '' -E "s/\"version\":[[:space:]]*\"[^\"]+\"/\"version\": \"${VERSION}\"/" tauri.conf.json

          # Refresh only workspace versions; retain the locked dependency versions.
          cargo update --workspace

          if [ -n "${CLIENT_ID:-}" ]; then
            cat > oauth-client.json <<EOF
          {
            "installed": {
              "client_id": "${CLIENT_ID}",
              "client_secret": "${CLIENT_SECRET:-}"
            }
          }
          EOF
          fi

      - name: Build macOS Universal app and DMG (Niki_macOS.dmg)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/build-macos.sh
          ./scripts/build-macos.sh --universal
          SHA256="$(shasum -a 256 target/release/Niki_macOS.dmg | awk '{print $1}')"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-release
          path: target/release/Niki_macOS.dmg

  publish-release:
    name: Publish GitHub Release
    needs: [test, build-windows, build-macos]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate multi-platform latest.json manifest
        shell: bash
        env:
          TAG: ${{ needs.build-windows.outputs.tag }}
          VERSION: ${{ needs.build-windows.outputs.version }}
          NOTES: ${{ needs.build-windows.outputs.notes }}
          WIN_SHA256: ${{ needs.build-windows.outputs.win_sha256 }}
          MAC_SHA256: ${{ needs.build-macos.outputs.mac_sha256 }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          WIN_URL="https://github.com/${REPO}/releases/download/${TAG}/Niki_Setup.exe"
          MAC_URL="https://github.com/${REPO}/releases/download/${TAG}/Niki_macOS.dmg"

          jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg win_url "$WIN_URL" \
            --arg win_sha "$WIN_SHA256" \
            --arg mac_url "$MAC_URL" \
            --arg mac_sha "$MAC_SHA256" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  url: $win_url,
                  signature: "",
                  sha256: $win_sha
                },
                "darwin-aarch64": {
                  url: $mac_url,
                  signature: "",
                  sha256: $mac_sha
                },
                "darwin-x86_64": {
                  url: $mac_url,
                  signature: "",
                  sha256: $mac_sha
                },
                "macos-universal": {
                  url: $mac_url,
                  signature: "",
                  sha256: $mac_sha
                }
              }
            }' > dist/latest.json

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-windows.outputs.tag }}
          name: Niki ${{ needs.build-windows.outputs.tag }}
          body: ${{ needs.build-windows.outputs.notes }}
          draft: false
          prerelease: false
          files: |
            dist/Niki_Setup.exe
            dist/Niki_macOS.dmg
            dist/latest.json
